<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>威胁感知大数据平台 - DPtech</title>
<style>
/* ================= DPtech 浅色企业后台风设计系统 ================= */
:root{
  --sb-bg:#1a3d6c;
  --sb-active:#234b82;
  --sb-hover:#24558f;
  --sb-text:#e8f0fc;
  --sb-text-dim:#9bb8e0;
  --sb-width:220px;
  --topbar-h:56px;
  --primary:#1890ff;
  --primary-hover:#40a9ff;
  --primary-light:#e6f7ff;
  --danger:#ff4d4f;
  --danger-light:#fff1f0;
  --warn:#faad14;
  --warn-light:#fffbe6;
  --ok:#52c41a;
  --ok-light:#f6ffed;
  --bg:#f0f2f5;
  --card:#ffffff;
  --border:#e8e8e8;
  --border-light:#f0f0f0;
  --text-primary:#262626;
  --text-secondary:#8c8c8c;
  --text-third:#bfbfbf;
  --shadow:0 1px 2px rgba(0,0,0,.06);
  --shadow-card:0 1px 4px rgba(0,0,0,.08);
  --radius:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:14px;color:var(--text-primary);background:var(--bg);line-height:1.5715}
a{color:var(--primary);text-decoration:none;cursor:pointer}
button{font-family:inherit;font-size:14px;cursor:pointer;border:none;background:none;color:inherit}
input,select{color:inherit;font-family:inherit;font-size:14px}
:focus{outline:none}
:focus-visible{outline:2px solid var(--primary);outline-offset:1px;border-radius:2px}
::selection{background:var(--primary);color:#fff}
svg{display:inline-block;vertical-align:middle}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#c1c1c1;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#a8a8a8}

/* ================= 布局骨架 ================= */
.app-layout{display:flex;height:100vh;overflow:hidden}

/* ===== 左侧导航栏 ===== */
.sidebar{
  width:var(--sb-width);min-width:var(--sb-width);
  background:var(--sb-bg);color:var(--sb-text);
  display:flex;flex-direction:column;
  overflow-y:auto;overflow-x:hidden;
  transition:transform .2s;z-index:100;
}
.sb-logo{
  height:56px;display:flex;align-items:center;padding:0 20px;
  gap:10px;border-bottom:1px solid rgba(255,255,255,.08);
  flex-shrink:0;
}
.sb-logo-icon{width:28px;height:28px;color:#69c1ff;flex-shrink:0}
.sb-logo-text{font-size:15px;font-weight:600;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-menu{padding:8px 0;flex:1}
.sb-group-title{
  padding:10px 20px 6px;font-size:12px;color:var(--sb-text-dim);
  text-transform:uppercase;letter-spacing:1px;font-weight:500;
}
.sb-item{
  display:flex;align-items:center;padding:10px 20px;
  cursor:pointer;transition:all .15s;
  font-size:14px;gap:10px;position:relative;
  user-select:none;
}
.sb-item:hover{background:var(--sb-hover)}
.sb-item.active{
  background:var(--sb-active);
  color:#fff;
}
.sb-item.active::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--primary);
}
.sb-item .sb-ico{width:16px;height:16px;flex-shrink:0;opacity:.85}
.sb-item .sb-arrow{margin-left:auto;font-size:11px;opacity:.5;transition:transform .2s}
.sb-item.open>.sb-arrow{transform:rotate(90deg)}
.sb-sub{overflow:hidden;transition:max-height .25s ease}
.sb-sub .sb-item{padding-left:44px;font-size:13px}
.sb-footer{
  padding:16px 20px;border-top:1px solid rgba(255,255,255,.08);
  font-size:11px;color:var(--sb-text-dim);line-height:1.6;
}

/* ===== 右侧主区域 ===== */
.main-area{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;background:var(--bg)}

/* ===== 顶栏 ===== */
.topbar{
  height:var(--topbar-h);background:#fff;
  display:flex;align-items:center;padding:0 24px;
  border-bottom:1px solid var(--border-light);
  flex-shrink:0;z-index:50;
}
.tb-breadcrumb{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--text-secondary);flex-shrink:0;margin-right:auto}
.tb-breadcrumb .cur{color:var(--text-primary);font-weight:500}
.tb-date-range{
  display:flex;align-items:center;gap:8px;
  padding:5px 12px;border:1px solid var(--border);border-radius:var(--radius);
  font-size:13px;color:var(--text-secondary);cursor:pointer;
  background:#fff;transition:border-color .15s;
}
.tb-date-range:hover{border-color:var(--primary)}
.tb-actions{display:flex;align-items:center;gap:16px;margin-left:16px}
.tb-icon-btn{
  width:32px;height:32px;border-radius:var(--radius);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .15s;color:var(--text-secondary);
  position:relative;
}
.tb-icon-btn:hover{color:var(--primary);background:var(--primary-light)}
.tb-icon-btn .dot{
  position:absolute;top:6px;right:6px;width:6px;height:6px;
  background:var(--danger);border-radius:50%;
}
.tb-user-dropdown{
  display:flex;align-items:center;gap:6px;
  cursor:pointer;padding:4px 8px;border-radius:var(--radius);
  font-size:13px;transition:background .15s;
}
.tb-user-dropdown:hover{background:var(--bg)}
.tb-avatar-sm{
  width:26px;height:26px;border-radius:50%;
  background:linear-gradient(135deg,#667eea,#764ba2);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;
}
.btn-primary-dp{
  background:var(--primary);color:#fff!important;
  padding:6px 16px;border-radius:var(--radius);
  font-size:13px;font-weight:500;transition:all .15s;
  display:inline-flex;align-items:center;gap:4px;
}
.btn-primary-dp:hover{background:var(--primary-hover)}

/* ===== 内容区 ===== */
.content-area{flex:1;overflow-y:auto;padding:20px 24px}

/* ================= 卡片组件 ================= */
.card{
  background:var(--card);border-radius:var(--radius);
  box-shadow:var(--shadow-card);border:1px solid var(--border-light);
  overflow:hidden;
}
.card-head{
  display:flex;align-items:center;padding:16px 20px;
  border-bottom:1px solid var(--border-light);
  font-size:15px;font-weight:600;color:var(--text-primary);
}
.card-head .sub{font-size:12px;font-weight:400;color:var(--text-secondary);margin-left:10px}
.card-body{padding:16px 20px}

/* ================= 统计卡片行 ================= */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.stat-card{
  background:var(--card);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow-card);
  border:1px solid var(--border-light);
  display:flex;align-items:center;gap:16px;
}
.stat-icon{
  width:48px;height:48px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;
}
.stat-icon.blue{background:var(--primary-light);color:var(--primary)}
.stat-icon.orange{background:var(--warn-light);color:var(--warn)}
.stat-icon.red{background:var(--danger-light);color:var(--danger)}
.stat-icon.green{background:var(--ok-light);color:var(--ok)}
.stat-info{flex:1}
.stat-value{font-size:26px;font-weight:700;line-height:1.2;color:var(--text-primary)}
.stat-label{font-size:13px;color:var(--text-secondary);margin-top:4px}
.stat-trend{font-size:12px;margin-top:4px}
.stat-trend.up{color:var(--danger)}
.stat-trend.down{color:var(--ok)}

/* ================= 图表区域（三列） ================= */
.chart-row{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:16px;margin-bottom:20px}
.chart-box{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-card);border:1px solid var(--border-light)}
.chart-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border-light);font-size:14px;font-weight:600}
.chart-body{padding:18px;display:flex;align-items:center;justify-content:center;min-height:240px;position:relative}

/* 环形图 */
.donut-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.donut-center{text-align:center}
.donut-num{font-size:32px;font-weight:800;color:var(--text-primary);line-height:1}
.donut-label{font-size:13px;color:var(--text-secondary)}
.donut-legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:8px}
.donut-legend-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-secondary)}
.donut-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}

/* 柱状图 */
.bar-chart{width:100%}
.bar-row{display:flex;align-items:center;margin-bottom:10px;gap:10px}
.bar-label{width:120px;font-size:12px;color:var(--text-secondary);text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;height:22px;background:var(--bg);border-radius:4px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:4px;transition:width .8s cubic-bezier(.22,1,.36,1);display:flex;align-items:center;padding-right:8px;justify-content:flex-end;font-size:11px;color:#fff;font-weight:600;min-width:0}
.bar-val{width:40px;font-size:13px;font-weight:600;color:var(--text-primary);text-align:right;flex-shrink:0}

/* ================= 数据表格 ================= */
.table-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-card);border:1px solid var(--border-light)}
.table-toolbar{
  display:flex;align-items:center;padding:12px 16px;
  border-bottom:1px solid var(--border-light);gap:8px;
}
.table-wrap{overflow-x:auto}
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{
  background:#fafafa;padding:10px 12px;text-align:left;
  font-weight:600;color:var(--text-secondary);white-space:nowrap;
  border-bottom:1px solid var(--border);position:sticky;top:0;
}
.data-table td{
  padding:10px 12px;border-bottom:1px solid var(--border-light);
  color:var(--text-primary);vertical-align:middle;
}
.data-table tbody tr:hover{background:var(--primary-light)}
.data-table tbody tr:nth-child(even){background:#fafcfe}
.pager-wrap{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;border-top:1px solid var(--border-light);
  font-size:13px;color:var(--text-secondary);
}
.pager-info{}
.pager-nav{display:flex;gap:4px}
.pg-btn{
  min-width:30px;height:30px;display:flex;align-items:center;
  justify-content:center;border:1px solid var(--border);border-radius:4px;
  cursor:pointer;font-size:12px;transition:all .15s;
}
.pg-btn:hover{border-color:var(--primary);color:var(--primary)}
.pg-btn.cur{background:var(--primary);color:#fff;border-color:var(--primary)}

/* ================= 标签/药丸 ================= */
.tag{
  display:inline-block;padding:2px 10px;border-radius:4px;
  font-size:12px;font-weight:500;white-space:nowrap;
}
.tag-red{background:var(--danger-light);color:var(--danger);border:1px solid #ffa39e}
.tag-orange{background:var(--warn-light);color:#d48806;border:1px solid #ffe58f}
.tag-blue{background:var(--primary-light);color:var(--primary);border:1px solid #91d5ff}
.tag-green{background:var(--ok-light);color:var(--ok);border:1px solid #b7eb8f}
.tag-gray{background:#f5f5f5;color:var(--text-secondary);border:1px solid #d9d9d9}

/* ================= 按钮 ================= */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:4px;
  padding:5px 12px;border-radius:var(--radius);font-size:13px;
  border:1px solid var(--border);background:#fff;cursor:pointer;
  transition:all .15s;color:var(--text-primary);
}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn-sm{padding:3px 10px;font-size:12px}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-hover);color:#fff}

/* ================= 登录页 ================= */
.login-page{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#1a3d6c 0%,#0f2550 50%,#1a3d6c 100%);
  position:relative;overflow:hidden;
}
.login-page::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(circle at 20% 80%,rgba(24,144,255,.15) 0%,transparent 50%),
    radial-gradient(circle at 80% 20%,rgba(114,124,255,.1) 0%,transparent 50%);
}
.login-card{
  width:400px;background:rgba(255,255,255,.95);backdrop-filter:blur(20px);
  border-radius:12px;padding:40px 36px;box-shadow:0 20px 60px rgba(0,0,0,.3);
  position:relative;z-index:1;text-align:center;
}
.login-logo{margin-bottom:24px}
.login-logo-icon{width:52px;height:52px;color:var(--primary)}
.login-title{font-size:22px;font-weight:700;color:var(--text-primary);margin-bottom:6px}
.login-sub{font-size:13px;color:var(--text-secondary);margin-bottom:28px}
.login-field{
  display:flex;align-items:center;gap:10px;
  border:1px solid var(--border);border-radius:var(--radius);
  padding:0 12px;margin-bottom:14px;background:#fff;
  transition:border-color .15s;
}
.login-field:focus-within{border-color:var(--primary);box-shadow:0 0 0 2px rgba(24,144,255,.1)}
.login-field input{flex:1;border:none;padding:11px 0;font-size:14px;background:transparent}
.login-field input::placeholder{color:var(--text-third)}
.login-btn{
  width:100%;padding:11px;border-radius:var(--radius);
  background:var(--primary);color:#fff;font-size:16px;font-weight:600;
  margin-top:6px;transition:all .15s;border:none;cursor:pointer;
}
.login-btn:hover{background:var(--primary-hover)}
.login-foot{margin-top:20px;font-size:12px;color:var(--text-third);line-height:1.6}

/* ================= 大屏页面（暗色） ================= */
.screen-page{
  position:fixed;inset:0;z-index:200;
  background:#0b1120;color:#e0e8f0;
  overflow:hidden;
}
.screen-header{
  height:60px;display:flex;align-items:center;justify-content:center;
  padding:0 24px;border-bottom:1px solid rgba(255,255,255,.06);
  position:relative;
}
.screen-title{font-size:20px;font-weight:700;letter-spacing:2px}
.screen-exit{
  position:absolute;left:20px;color:rgba(255,255,255,.5);
  cursor:pointer;font-size:14px;display:flex;align-items:center;gap:4px;
  transition:color .15s;
}
.screen-exit:hover{color:#fff}
.screen-time{position:absolute;right:24px;font-size:13px;color:rgba(255,255,255,.4);font-variant-numeric:tabular-nums}
.screen-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:16px;
  padding:16px 20px;height:calc(100vh - 60px);overflow-y:auto;
}
.screen-panel{
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);
  border-radius:8px;overflow:hidden;
}
.screen-panel-head{
  padding:12px 16px;font-size:14px;font-weight:600;
  border-bottom:1px solid rgba(255,255,255,.06);
  display:flex;align-items:center;gap:8px;
}
.screen-panel-body{padding:14px 16px}

/* 世界地图占位 */
.world-map{
  width:100%;height:280px;
  background:
    radial-gradient(ellipse at 50% 40%,rgba(250,173,20,.12) 0%,transparent 55%),
    radial-gradient(ellipse at 30% 60%,rgba(24,144,255,.08) 0%,transparent 45%),
    linear-gradient(180deg,rgba(255,255,255,.02),transparent);
  border-radius:6px;display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
.map-country{position:absolute;border-radius:2px;opacity:.6;transition:opacity .3s}
.map-country.hot{opacity:.9;box-shadow:0 0 12px rgba(250,173,20,.3)}

/* 攻击来源列表 */
.attack-list{display:flex;flex-direction:column;gap:8px}
.attack-item{
  display:flex;align-items:center;gap:10px;padding:8px 10px;
  background:rgba(255,255,255,.03);border-radius:6px;
}
.attack-flag{font-size:18px;width:28px;text-align:center}
.attack-name{flex:1;font-size:12px;color:rgba(255,255,255,.7);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attack-bar-track{width:80px;height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.attack-bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#faad14,#ff7a45)}
.attack-count{font-size:13px;font-weight:700;color:#faad14;width:36px;text-align:right}

/* 地区卡片 */
.region-cards{display:flex;flex-direction:column;gap:8px}
.region-card{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  background:rgba(255,255,255,.04);border-radius:6px;
  border:1px solid rgba(255,255,255,.06);
}
.region-flag{font-size:20px;width:32px;text-align:center}
.region-info{flex:1}
.region-name{font-size:13px;font-weight:600;color:rgba(255,255,255,.85)}
.region-detail{font-size:11px;color:rgba(255,255,255,.4);margin-top:2px}
.region-stat{font-size:18px;font-weight:700;color:#1890ff;text-align:right}

/* Toast */
.toast-container{
  position:fixed;top:16px;right:16px;z-index:9999;
  display:flex;flex-direction:column;gap:8px;
}
.toast{
  padding:10px 20px;border-radius:var(--radius);font-size:13px;
  box-shadow:0 4px 16px rgba(0,0,0,.15);animation:toastIn .25s ease;
  display:flex;align-items:center;gap:8px;max-width:360px;
}
.toast.info{background:#fff;color:var(--text-primary);border:1px solid var(--border)}
.toast.success{background:var(--ok-light);color:#389e0d;border:1px solid #b7eb8f}
.toast.error{background:var(--danger-light);color:var(--danger);border:1px solid #ffa39e}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}

/* Modal / Drawer */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;display:flex;align-items:center;justify-content:center}
.modal{
  background:#fff;border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.2);
  width:480px;max-width:90vw;max-height:80vh;overflow-y:auto;
}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:600}
.modal-x{cursor:pointer;font-size:18px;color:var(--text-secondary);transition:color .15s}
.modal-x:hover{color:var(--text-primary)}
.modal-body{padding:20px;font-size:14px;line-height:1.8;color:var(--text-secondary)}
.modal-foot{padding:12px 20px;border-top:1px solid var(--border-light);display:flex;justify-content:flex-end;gap:8px}

.drawer-mask{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:300;transition:opacity .25s}
.drawer{
  position:fixed;right:0;top:0;bottom:0;width:520px;max-width:100vw;
  background:#fff;z-index:301;box-shadow:-4px 0 24px rgba(0,0,0,.12);
  display:flex;flex-direction:column;transform:translateX(0);
  transition:transform .25s ease;
}
.drawer-head{padding:16px 20px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:600}
.drawer-body{flex:1;overflow-y:auto;padding:16px 20px}
.drawer-foot{padding:12px 20px;border-top:1px solid var(--border-light);display:flex;gap:8px}

/* 抽屉标签页 */
.d-tabs{display:flex;gap:0;border-bottom:1px solid var(--border-light);margin-bottom:14px}
.d-tab{padding:8px 16px;cursor:pointer;font-size:13px;color:var(--text-secondary);border-bottom:2px solid transparent;transition:all .15s}
.d-tab.cur{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}

/* 动画 */
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
.shake{animation:shake .4s ease}
@keyframes spin{to{transform:rotate(360deg)}}.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .6s linear infinite}
.spinning .refresh-ico{animation:spin .8s linear infinite}

/* 雷达图容器（勒索专项复用暗色风格） */
.radar-dark{background:linear-gradient(180deg,#0d1626 0%,#0a1020 100%);border-radius:8px;padding:20px}

/* 工具类 */
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}
.text-center{text-align:center}
.mt-8{margin-top:8px}.mt-16{margin-top:16px}.mb-8{margin-bottom:8px}.mb-16{margin-bottom:16px}
.flex{display:flex}.items-center{align-items:center}.gap-8{gap:8px}.gap-16{gap:16px}
.gap-auto{gap:auto}.flex-1{flex:1}
</style>
</head>
<body>
<div id="appRoot"></div>
<div id="fullRoot"></div>

function go(h){location.hash=h}
function toast(msg,type){
 type=type||'info';
 const r=document.getElementById('toastRoot');
 const el=document.createElement('div');
 el.className='toast '+type;
 el.innerHTML=(type==='success'?'✅':type==='error'?'❌':'ℹ️')+' <span>'+esc(msg)+'</span>';
 r.appendChild(el);
 setTimeout(()=>{el.style.opacity='0';el.style.transform='translateX(40px)';setTimeout(()=>el.remove(),250)},2600);
}
function openModal(html){
 $('#modalRoot').innerHTML='<div class="modal-mask" id="modalMask"><div class="modal" role="dialog" aria-modal="true">'+html+'</div></div>';
 $('#modalMask').addEventListener('click',e=>{if(e.target.id==='modalMask')closeModal()});
 const f=$('#modalRoot .modal [data-autofocus]'); if(f)f.focus();
}
function closeModal(){ $('#modalRoot').innerHTML='' }

/* ================= 通用小件 ================= */
function donut(pct,color,size,sw){
 size=size||64;sw=sw||8;
 const r=(size-sw)/2,c=2*Math.PI*r,off=c*(1-pct/100);
 return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" role="img">'
 +'<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" stroke="#f0f0f0" stroke-width="'+sw+'" fill="none"/>'
 +'<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" stroke="'+color+'" stroke-width="'+sw+'" fill="none" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 '+size/2+' '+size/2+')"/></svg>';
}
function countup(el,target,dur){
 if(RM){el.textContent=target.toLocaleString();return}
 dur=dur||900;const t0=performance.now();
 (function step(t){const p=Math.min(1,(t-t0)/dur),v=Math.round(target*(1-Math.pow(1-p,3)));
  el.textContent=v.toLocaleString(); if(p<1)requestAnimationFrame(step)})(t0);
}
function bindRefresh(id){
 const b=$(id); if(!b)return;
 b.addEventListener('click',()=>{
  const ic=b.querySelector('.refresh-ico'); if(ic){ic.classList.remove('spinning');void ic.offsetWidth;ic.classList.add('spinning')}

  fn(); window.scrollTo(0,0);return;
 }

 fn(); window.scrollTo(0,0);
}

function radarSvg(){
 const cx=200,cy=132,R=88;
 const pt=(ang,r)=>{const a=ang*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]};
 let rings='';
 [1/3,2/3,1].forEach(f=>{
  const pts=ransomDims.map(d=>pt(d[2],R*f).map(v=>v.toFixed(1)).join(',')).join(' ');
  rings+='<polygon points="'+pts+'" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="1"/>';
 });
 let axes='',labels='';
 ransomDims.forEach(d=>{
  const p=pt(d[2],R);
  axes+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'" stroke="rgba(255,255,255,.09)"/>';
  const lp=pt(d[2],R+16);
  const anch=Math.abs(Math.cos(d[2]*Math.PI/180))<0.3?'middle':(Math.cos(d[2]*Math.PI/180)>0?'start':'end');
  labels+='<text class="radar-dim'+(d[1]===0?' zero':'')+'" data-dim="'+d[0]+'" data-n="'+d[1]+'" x="'+lp[0].toFixed(1)+'" y="'+(lp[1]+4).toFixed(1)+'" text-anchor="'+anch+'">'+d[0]+'('+d[1]+')</text>';
 });
 const dotSeed=[[0.28,-14],[0.4,10],[0.52,-6],[0.62,14],[0.72,-12],[0.84,6],[0.94,-4]];
 const srcs=['SAC3000-NDR','DPtech-FW'];
 let dots='',di=0;
 ransomDims.forEach(d=>{
  for(let k=0;k<d[1];k++){
   const s=dotSeed[(di*3+k)%dotSeed.length];
   const p=pt(d[2]+s[1],R*s[0]);
   const src=srcs[(di+k)%2];
   dots+='<circle data-src="'+src+'" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.4" fill="#ff4d4d" opacity=".9" style="filter:drop-shadow(0 0 3px rgba(255,77,77,.8))"><title>'+d[0]+' · '+src+'</title></circle>';
  }
  if(d[1]>0)di++;
 });
 const g1=pt(-30,R),g2=pt(26,R);
 return '<svg width="100%" height="268" viewBox="0 0 400 268" role="img">'
 +'<defs><linearGradient id="swg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1890ff" stop-opacity="0"/><stop offset="1" stop-color="#1890ff" stop-opacity=".3"/></linearGradient></defs>'
 +rings+axes
 +'<g class="radar-sweep"><path d="M'+cx+' '+cy+' L'+g1[0].toFixed(1)+' '+g1[1].toFixed(1)+' A'+R+' '+R+' 0 0 0 '+g2[0].toFixed(1)+' '+g2[1].toFixed(1)+' Z" fill="url(#swg)"/></g>'
 +dots
 +'<circle cx="'+cx+'" cy="'+cy+'" r="3" fill="#1890ff"/>'
 +labels+'</svg>';
}

/* ================= 告警详情抽屉 ================= */
function openDrawer(type,idx){state.drawer={type:type,idx:idx};state.drawerTab=0;renderDrawer()}
function closeDrawer(silent){state.drawer=null;const r=$('#drawerRoot');if(r)r.innerHTML=''}
function renderDrawer(){
 const d=state.drawer;const root=$('#drawerRoot');
 if(!d){root.innerHTML='';return}
 const isR=d.type==='ransom';
 const rows=isR?ransomRows:miningRows;
 const r=rows[d.idx];if(!r)return;
 const key=d.type+'-'+d.idx;
 const st=state.handled[key];
 const alarmId=(isR?2145000276:2145000331)-d.idx;
 const stHtml=st==='doing'?'<span class="tag tag-orange">处置中</span>':st==='done'?'<span class="tag tag-green">已处置</span>':'<span class="tag tag-red">未处置</span>';
 const tabs=['最近详情','命中规则','原始日志','处置建议'];
 let tabBody='';
 if(state.drawerTab===0){
  tabBody='<div style="font-size:13px;line-height:2.2;color:var(--text-secondary)">'
  +'<div style="display:flex;gap:12px;margin-bottom:8px"><b style="color:var(--text-primary);white-space:nowrap">时间线：</b>'
  +'<div><div style="color:var(--text-secondary)">'+r.t.slice(0,11)+'03:08:12</div><div>检测到异常外联：'+r.vip+' → '+(isR?(r.aip||'45.155.204.117'):r.pool)+'</div>'
  +'<div>'+r.t.slice(11)+' 命中'+(isR?'勒索特征（'+r.fam+'）':'挖矿通信特征（'+r.fam+'）')+'</div>'
  +'<div style="color:var(--danger);font-weight:600">生成'+r.level+'告警</div></div></div></div>';
 }else if(state.drawerTab===1){
  tabBody='<div style="background:var(--bg);border-radius:6px;padding:14px;border:1px solid var(--border-light)"><div style="font-weight:600;margin-bottom:8px">'+(isR?'勒索软件检测-'+r.fam:'挖矿行为检测-'+r.fam)+'</div>'
  +'<div style="display:grid;grid-template-columns:auto 1fr;gap:6px;font-size:12px">'
  +'<div style="color:var(--text-secondary)">严重等级</div><div>'+(r.level==='高威胁'?'<span class="tag tag-red">高</span>':'<span class="tag tag-orange">中</span>')+'</div>'
  +'<div style="color:var(--text-secondary)">命中次数</div><div><b class="num">'+r.n+'</b></div>'
  +'<div style="color:var(--text-secondary)">规则来源</div><div>'+(isR?'内置情报（IOC）':'本地挖矿规则库')+'</div>'
  +'<div style="color:var(--text-secondary)">最近命中</div><div><span class="num">'+r.t+'</span></div>'
  +'</div></div>';
 }else if(state.drawerTab===2){
  tabBody='<table class="data-table" style="font-size:12px"><thead><tr><th>时间</th><th>源IP:端口</th><th>目的IP:端口</th><th>协议</th><th>动作</th></tr></thead><tbody>'
  +'<tr><td class="num">'+r.t+'</td><td class="num">'+r.vip+':'+(isR?'51234':'49876')+'</td><td class="num">'+(isR?(r.aip||'45.155.204.117'):r.pool)+'</td><td>'+(isR?'TLS':'Stratum/TCP')+'</td><td>'+(isR?'已阻断':'已记录')+'</td></tr>'
  +'</tbody></table>';
 }else{
  const sug=isR
   ?['立即隔离受害'+(r.vtype==='服务器'?'服务器':'终端')+' '+r.vip+'，阻断内外网通信','在出口封禁攻击者 IP '+(r.aip||'45.155.204.117'),'对 '+r.vip+' 进行勒索病毒专杀与全盘扫描','检查是否存在未打补丁的勒索常用漏洞（如 MS17-010）','修改该资产及域内相关账号口令，排查横向移动痕迹']
   :['立即隔离失陷'+(r.vtype==='服务器'?'服务器':'终端')+' '+r.vip+'，阻断内外网通信','在出口封禁矿池地址 '+r.pool,'查杀挖矿进程与持久化项（计划任务/自启动）','排查同类资产是否被植入挖矿木马','基线加固：关闭高危端口、修复弱口令'];
  tabBody='<ol style="padding-left:18px;line-height:2.2;font-size:13px;color:var(--text-secondary)">'+sug.map(s=>'<li>'+s+'</li>').join('')+'</ol>';
 }
 root.innerHTML='<div class="drawer-mask" id="dMask"></div>'
 +'<div class="drawer open" role="dialog" aria-modal="true">'
 +'<div class="drawer-head">告警详情 <button class="modal-x" id="dX">✕</button></div>'
 +'<div class="drawer-body">'
 +'<div style="margin-bottom:14px">'
 +'<div style="font-size:15px;font-weight:700">'+I.virus+' '+esc(r.desc)
 +' <button class="btn btn-sm" id="dCopy" title="复制">'+I.copy+'</button></div>'
 +'<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;font-size:12px">'
 +'<span>状态：'+stHtml+'</span>'
 +'<span>| 类型：'+(isR?'勒索':'挖矿')+'</span>'
 +'<span>| 等级：<b style="'+(r.level==='高威胁'?'color:var(--danger)':'color:#d48806')+'">'+r.level+'</b></span>'
 +'<span>| 告警ID：<span class="num">'+alarmId+'</span></span>'
 +'</div></div>'
 +'<div class="d-tabs">'+tabs.map((t,i)=>'<button class="d-tab'+(state.drawerTab===i?' cur':'')+'" data-tab="'+i+'">'+t+'</button>').join('')+'</div>'
 +'<div id="dTabBody">'+tabBody+'</div>'
 +'<div style="margin-top:16px;display:flex;gap:8px">'
 +'<button class="btn btn-primary btn-sm" id="dAction">联动处置</button>'
 +'<button class="btn btn-sm" id="dDone">标记已处置</button>'
 +'</div></div>'
 +'<div class="drawer-foot"><button class="btn" id="dPrev">← 上一条</button><button class="btn" id="dNext">下一条 →</button></div>'
 +'</div>';
 $('#dX').addEventListener('click',()=>closeDrawer());
 $('#dMask').addEventListener('click',()=>closeDrawer());
 $('#dCopy').addEventListener('click',()=>{if(navigator.clipboard)navigator.clipboard.writeText(r.desc);toast('已复制','success')});
 $$('.drawer .d-tab').forEach(el=>el.addEventListener('click',()=>{state.drawerTab=+el.getAttribute('data-tab');renderDrawer()}));
 $('#dPrev').addEventListener('click',()=>{state.drawer.idx=(d.idx-1+rows.length)%rows.length;renderDrawer()});
 $('#dNext').addEventListener('click',()=>{state.drawer.idx=(d.idx+1)%rows.length;renderDrawer()});
 $('#dDone').addEventListener('click',()=>{state.handled[key]='done';toast('已标记为已处置','success');renderDrawer();const h=location.hash;if(h==='#/threat/ransom')renderRansomTbody();if(h==='#/threat/mining')renderMiningTbody()});
 $('#dAction').addEventListener('click',()=>{
  openModal('<div class="modal-head">联动处置确认<button class="modal-x" id="cmX">✕</button></div>'
  +'<div class="modal-body">将对 <b class="num">'+r.vip+'</b> 执行隔离并联动封禁攻击源，是否确认？</div>'
  +'<div class="modal-foot"><button class="btn" id="cmNo">取消</button><button class="btn btn-primary" id="cmYes" data-autofocus>确认处置</button></div>');
  $('#cmX').addEventListener('click',closeModal);
  $('#cmNo').addEventListener('click',closeModal);
  $('#cmYes').addEventListener('click',()=>{
   const b=$('#cmYes');b.disabled=true;b.innerHTML='<span class="spin"></span> 下发中…';
   setTimeout(()=>{closeModal();state.handled[key]='doing';toast('隔离指令已下发（演示）','success');renderDrawer()},800);
  });
 });
}
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if($('#modalRoot').innerHTML)closeModal();else if(state.drawer)closeDrawer();}
});
